<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello｜多益學習夥伴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Noto+Serif+TC:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#8B7FD1;
    --accent-dim:#6C5FB0;
    --accent-soft:#EDE9FB;
    --accent-soft-text:#6C5FB0;
    --ink:#332C4D;
    --ink-2:rgba(255,255,255,0.55);
    --ink-3:rgba(90,70,140,0.14);
    --accent-glow-1:rgba(139,127,209,0.38);
    --accent-glow-2:rgba(185,175,225,0.30);
    --accent-glow-3:rgba(122,108,196,0.26);
    --paper:#FFFFFF;
    --paper-2:#F4F0FC;
    --teal:#5FAE9E;
    --rust:#D9765F;
    --wrong:#E5484D;
    --wrong-dim:#B23A3D;
    --wrong-soft:#FBEAEA;
    --hamburger-color:#4E5366;
    --hamburger-glow:none;
    --ink-muted:#79708F;
    --paper-muted:#8B84A3;
    --radius:22px;
    --font-display:'Fraunces','Noto Serif TC',serif;
    --font-body:'Inter','Noto Sans TC',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --glass-blur:blur(20px);

    /* ===== DS-001 Reading Scale System =====
       --reading-scale 與 --line-height-base 由 html[data-reading-size] 決定，
       其餘所有 typography / spacing / component token 都從這兩個變數推算出來。
       換 Reading Size 只需要換這兩個根源變數，其他 token 自動連動，
       所以之後新增的頁面/元件只要吃這些 token，就會自動支援 Reading Size，不用額外處理。 */
    --reading-scale:1;
    --line-height-base:1.5;

    /* Typography tokens */
    --text-xs:calc(11px * var(--reading-scale));
    --text-sm:calc(12.5px * var(--reading-scale));
    --text-base:calc(14.5px * var(--reading-scale));
    --text-md:calc(16px * var(--reading-scale));
    --text-lg:calc(19px * var(--reading-scale));
    --text-xl:calc(22.5px * var(--reading-scale));
    --text-2xl:calc(27px * var(--reading-scale));

    /* Spacing tokens */
    --space-2xs:calc(4px * var(--reading-scale));
    --space-xs:calc(8px * var(--reading-scale));
    --space-sm:calc(12px * var(--reading-scale));
    --space-md:calc(16px * var(--reading-scale));
    --space-lg:calc(24px * var(--reading-scale));
    --space-xl:calc(32px * var(--reading-scale));

    /* Component tokens */
    --card-padding:calc(24px * var(--reading-scale));
    --card-padding-sm:calc(18px * var(--reading-scale));
    --component-padding-x:calc(16px * var(--reading-scale));
    --component-padding-y:calc(10px * var(--reading-scale));
    --btn-padding-y:calc(12px * var(--reading-scale));
    --btn-padding-x:calc(22px * var(--reading-scale));
    --btn-height:calc(46px * var(--reading-scale));
    --input-height:calc(42px * var(--reading-scale));
    --input-padding-y:calc(10px * var(--reading-scale));
    --list-row-height:calc(48px * var(--reading-scale));
    --list-row-padding-y:calc(15px * var(--reading-scale));
  }
  /* Reading Size presets：只換這兩個根源變數，--hero-card / .bottom-nav / 版面結構刻意不吃這些 token，維持原比例 */
  html[data-reading-size="small"]{ --reading-scale:0.9; --line-height-base:1.42; }
  html[data-reading-size="medium"]{ --reading-scale:1; --line-height-base:1.5; }
  html[data-reading-size="large"]{ --reading-scale:1.15; --line-height-base:1.6; }
  html[data-reading-size="xlarge"]{ --reading-scale:1.3; --line-height-base:1.7; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, var(--accent-glow-1), transparent 42%),
      radial-gradient(circle at 88% 20%, var(--accent-glow-2), transparent 42%),
      radial-gradient(circle at 25% 92%, var(--accent-glow-3), transparent 46%),
      linear-gradient(180deg,#F8F5FF 0%,#FBFAFF 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    font-size:var(--text-base);
    line-height:var(--line-height-base);
  }
  #root{max-width:880px;margin:0 auto;padding:20px 16px 90px;position:relative;}
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;height:62px;background:var(--ink-2);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-top:1px solid rgba(255,255,255,0.6);display:flex;z-index:45;box-shadow:0 -8px 30px rgba(120,100,180,0.10);}
  .bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--ink-muted);font-size:10.5px;font-weight:600;transition:color .15s ease;}
  .bottom-nav-item.active{color:var(--accent-dim);}
  #root.dissolving{animation:dissolveOut .28s ease-in forwards;}
  #root.materializing-root{animation:materializeIn .38s ease-out forwards;}
  @keyframes dissolveOut{
    0%{opacity:1;filter:blur(0) saturate(1);transform:scale(1);}
    100%{opacity:0;filter:blur(12px) saturate(1.3);transform:scale(1.04);}
  }
  @keyframes materializeIn{
    0%{opacity:0;filter:blur(10px) saturate(1.15);transform:scale(0.95);}
    55%{opacity:1;}
    100%{opacity:1;filter:blur(0) saturate(1);transform:scale(1);}
  }
  #root.dissolving::after{
    content:'';position:fixed;inset:-15%;pointer-events:none;z-index:60;
    background:
      radial-gradient(ellipse 16% 42% at 50% 44%, var(--accent-glow-1) 0%, var(--accent-glow-2) 38%, transparent 72%),
      radial-gradient(circle, var(--accent) 0.55px, transparent 1.1px);
    background-size: cover, 5px 5px;
    -webkit-mask-image:radial-gradient(ellipse 17% 44% at 50% 44%, black 0%, black 50%, transparent 78%);
    mask-image:radial-gradient(ellipse 17% 44% at 50% 44%, black 0%, black 50%, transparent 78%);
    animation:smokeOut .28s ease-out forwards;
  }
  #root.materializing-root::after{
    content:'';position:fixed;inset:-15%;pointer-events:none;z-index:60;
    background:
      radial-gradient(ellipse 16% 42% at 50% 44%, var(--accent-glow-1) 0%, var(--accent-glow-2) 38%, transparent 72%),
      radial-gradient(circle, var(--accent) 0.55px, transparent 1.1px);
    background-size: cover, 5px 5px;
    -webkit-mask-image:radial-gradient(ellipse 17% 44% at 50% 44%, black 0%, black 50%, transparent 78%);
    mask-image:radial-gradient(ellipse 17% 44% at 50% 44%, black 0%, black 50%, transparent 78%);
    animation:smokeIn .38s ease-in forwards;
  }
  @keyframes smokeOut{
    0%{opacity:0;transform:scale(0.85) translateY(0);}
    30%{opacity:0.75;}
    100%{opacity:0;transform:scale(1.4) translateY(-30px);}
  }
  @keyframes smokeIn{
    0%{opacity:0;transform:scale(1.35) translateY(20px);}
    45%{opacity:0.65;}
    100%{opacity:0;transform:scale(0.9) translateY(0);}
  }

  .topbar{display:flex;align-items:center;gap:12px;padding:8px 2px 26px;}
  .logo-mark{display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .15s ease;flex:none;width:42px;height:42px;}
  .logo-mark:hover{transform:scale(1.1);}
  .logo-spark-svg{filter:drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 12px var(--accent-soft));animation:sparklePulse 3s ease-in-out infinite;}
  @keyframes sparklePulse{0%,100%{opacity:0.88;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}
  .splash-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:
      radial-gradient(circle at 15% 8%, var(--accent-glow-1), transparent 42%),
      radial-gradient(circle at 88% 20%, var(--accent-glow-2), transparent 42%),
      radial-gradient(circle at 25% 92%, var(--accent-glow-3), transparent 46%),
      linear-gradient(180deg,#F8F5FF 0%,#FBFAFF 100%);
    transition:opacity .55s ease, filter .55s ease;
  }
  .splash-screen.fade-out{opacity:0;filter:blur(10px);pointer-events:none;}
  .splash-spark{filter:drop-shadow(0 0 10px var(--accent)) drop-shadow(0 0 20px var(--accent-soft));animation:sparklePulse 1.8s ease-in-out infinite;}
  .splash-title{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:24px;color:var(--ink);letter-spacing:0.08em;}
  .splash-sub{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);letter-spacing:0.1em;}
  .greeting{flex:1;min-width:0;}
  .greeting-hello{font-family:var(--font-display);font-style:italic;font-size:14px;color:var(--ink-muted);line-height:1.1;}
  .greeting-name{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hamburger-btn{width:42px;height:42px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .15s ease,opacity .15s ease;}
  .hamburger-btn:hover{transform:scale(1.1);opacity:0.72;}
  .hamburger-icon{width:16px;height:11px;position:relative;filter:var(--hamburger-glow,none);}
  .hamburger-icon span{position:absolute;left:0;right:0;height:1.6px;background:var(--hamburger-color,#4E5366);border-radius:2px;}
  .hamburger-icon span:nth-child(1){top:0;}
  .hamburger-icon span:nth-child(2){top:4.5px;}
  .hamburger-icon span:nth-child(3){top:9px;}

  .card{background:var(--ink-2);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,0.6);box-shadow:0 8px 30px rgba(120,100,180,0.10);border-radius:var(--radius);padding:var(--card-padding);margin-bottom:var(--space-md);}
  .tier-card{cursor:pointer;transition:transform .15s ease,border-color .15s ease;}
  .tier-card:hover{transform:translateY(-2px);border-color:var(--accent-dim);}
  .tier-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .tier-time{font-family:var(--font-mono);font-size:12.5px;font-weight:700;color:var(--accent-dim);background:var(--accent-soft);padding:6px 13px;border-radius:99px;white-space:nowrap;flex:none;}
  .skip-link{font-size:13px;color:var(--ink-muted);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;}
  .skip-link:hover{color:var(--accent-dim);}
  .card-paper{background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:var(--card-padding);box-shadow:0 8px 30px rgba(120,100,180,0.10);}

  h1{font-family:var(--font-display);font-weight:600;font-size:var(--text-2xl);line-height:1.25;margin:0 0 var(--space-xs);}
  h2{font-family:var(--font-display);font-weight:600;font-size:var(--text-lg);margin:0 0 var(--space-sm);}
  p{margin:0 0 var(--space-sm);color:inherit;}
  .muted{color:var(--ink-muted);font-size:var(--text-sm);}
  .card-paper .muted{color:var(--paper-muted);}

  .btn{font-family:var(--font-body);font-weight:700;font-size:var(--text-base);padding:var(--btn-padding-y) var(--btn-padding-x);min-height:var(--btn-height);border-radius:14px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1.2;transition:transform .1s ease, filter .15s ease, opacity .15s ease;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--paper-2);color:var(--ink);border:1px solid var(--ink-3);}
  .btn-ghost:hover{border-color:var(--accent-dim);}
  .btn-paper{background:var(--ink);color:var(--paper);}
  .btn-paper:hover{filter:brightness(1.15);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:var(--space-xs);flex-wrap:wrap;margin-top:var(--space-sm);}
  .btn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-xs);margin-top:var(--space-sm);}
  .btn-grid .btn{width:100%;}
  .btn-grid>.btn:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:auto;min-width:50%;}
  @media(max-width:360px){ .btn-grid{grid-template-columns:1fr;} .btn-grid>.btn:last-child:nth-child(odd){width:100%;} }

  /* 首頁等級卡 */
  .hero-card{position:relative;background:var(--paper);color:var(--ink);border-radius:28px;padding:30px 28px;margin-bottom:18px;overflow:hidden;box-shadow:0 20px 60px rgba(120,100,180,0.16);}
  .hero-orb{position:absolute;width:230px;height:230px;border-radius:50%;top:-70px;right:-60px;background:radial-gradient(circle at 35% 35%, var(--accent-glow-1), var(--accent-glow-2) 55%, transparent 76%);filter:blur(4px);}
  .hero-content{position:relative;z-index:1;}
  .hero-eyebrow{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--paper-muted);font-weight:700;margin-bottom:6px;}
  .hero-level{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:27px;margin-bottom:4px;letter-spacing:0.1em;}
  .hero-score-row{display:flex;align-items:baseline;gap:8px;margin-top:16px;}
  .hero-score{font-family:var(--font-mono);font-weight:600;font-size:44px;color:var(--accent-dim);}
  .hero-score-label{font-size:11px;color:var(--paper-muted);letter-spacing:0.06em;text-transform:uppercase;}
  .hero-ai-msg{font-size:13px;color:var(--accent-dim);font-weight:600;margin-top:10px;}
  .focus-card{padding:20px 22px;}
  .recommended-card{background:var(--accent-soft);border-color:transparent;}
  .focus-card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .focus-card-label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-muted);font-weight:700;margin-bottom:4px;}
  .focus-card-title{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink);}
  .upcoming-row{display:flex;justify-content:space-between;align-items:center;padding:12px 6px;cursor:pointer;border-bottom:1px solid var(--ink-3);margin-bottom:6px;}
  .upcoming-link{font-size:12px;font-weight:700;color:var(--accent-dim);}
  .journey-steps{display:flex;align-items:center;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
  .journey-step{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--ink-2);color:var(--ink-muted);white-space:nowrap;}
  .journey-step.done{background:var(--accent-soft);color:var(--accent-dim);}
  .journey-step.current{background:var(--accent);color:#fff;}
  .journey-arrow{font-size:11px;color:var(--ink-3);}

  /* 新手導覽流程 */
  .onboard-screen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px 20px;animation:materialize .4s ease;}
  .onboard-screen h1{font-size:24px;margin-bottom:2px;}
  .onboard-input{width:100%;max-width:320px;padding:14px 16px;border-radius:14px;border:1px solid var(--ink-3);background:var(--paper-2);color:var(--ink);font-family:var(--font-body);font-size:16px;text-align:center;margin-top:18px;}
  .onboard-input:focus{outline:none;border-color:var(--accent-dim);}
  .hello-greeting-big{display:flex;flex-direction:column;align-items:center;}
  .greeting-hello-big{font-family:var(--font-display);font-style:italic;font-size:24px;color:var(--ink-muted);}
  .greeting-name-big{font-family:var(--font-display);font-weight:600;font-style:italic;font-size:44px;color:var(--ink);letter-spacing:0.04em;}
  .onboard-icon{font-size:46px;margin-bottom:6px;}
  .onboard-icon-svg{width:56px;height:56px;color:var(--accent-dim);display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
  .onboard-icon-svg svg{width:100%;height:100%;}
  .onboard-dots{display:flex;gap:6px;margin:20px 0 4px;}
  .onboard-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);transition:background .2s ease;}
  .onboard-dot.on{background:var(--accent);}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0;}
  .stat-box{background:var(--ink-2);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,0.6);border-radius:16px;padding:var(--space-sm) var(--space-md);transition:transform .15s ease,border-color .15s ease;}
  .stat-box.clickable{cursor:pointer;}
  .stat-box.clickable:hover{transform:translateY(-2px);border-color:var(--accent-dim);}
  .stat-box .num{font-family:var(--font-mono);font-size:24px;font-weight:600;color:var(--accent-dim);}
  .stat-box .lbl{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}

  .progress-track{height:6px;background:var(--ink-3);border-radius:99px;overflow:hidden;margin:14px 0 4px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--wrong));border-radius:99px;transition:width .3s ease;}
  .progress-label{font-size:12px;color:var(--ink-muted);}

  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:0.03em;}
  .badge-vocab{background:rgba(95,174,158,0.16);color:#3F8677;}
  .badge-grammar{background:var(--accent-soft);color:var(--accent-soft-text);}
  .badge-review{background:var(--wrong-soft);color:var(--wrong-dim);}
  .badge-listening{background:rgba(121,112,143,0.14);color:#5C5476;}
  .badge-scenario{background:rgba(95,174,158,0.14);color:#3F8677;}
  .diff-dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px;}
  .diff-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);}
  .diff-dot.on{background:var(--accent);}

  .q-card{background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:26px;box-shadow:0 12px 40px rgba(120,100,180,0.14);}
  .q-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap;}
  .q-meta-right{display:flex;align-items:center;gap:8px;}
  .heart-btn{background:none;border:none;font-size:19px;line-height:1;color:var(--ink-muted);cursor:pointer;padding:2px;transition:transform .15s ease,color .15s ease;}
  .heart-btn:hover{transform:scale(1.15);}
  .heart-btn.active{color:var(--wrong);}
  .due-badge{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--accent-dim);background:var(--accent-soft);padding:5px 10px;border-radius:99px;white-space:nowrap;animation:materialize .3s ease;}
  .q-text{font-family:var(--font-display);font-size:var(--text-lg);font-weight:600;line-height:var(--line-height-base);margin-bottom:var(--space-md);}
  .q-text-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px;}
  .q-text-row .q-text{margin-bottom:0;flex:1;}
  .icon-btn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid rgba(51,44,77,0.12);background:var(--paper-2);color:var(--ink);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:border-color .15s ease;}
  .speed-btn{font-family:var(--font-mono);font-size:12.5px;font-weight:700;color:var(--accent-dim);background:var(--accent-soft);border:none;padding:8px 13px;border-radius:99px;cursor:pointer;transition:transform .12s ease;}
  .speed-btn:hover{transform:scale(1.06);}
  .icon-btn:hover{border-color:var(--accent-dim);}
  .speak-word{cursor:pointer;border-bottom:1.5px dotted currentColor;}
  .speak-word:hover{opacity:0.75;}
  .tap-word{cursor:pointer;border-bottom:1px dotted transparent;transition:border-color .15s ease;}
  .tap-word:hover{border-bottom-color:currentColor;}
  .opt-list{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:center;gap:var(--space-sm);background:var(--paper-2);border:1.5px solid transparent;border-radius:14px;padding:var(--component-padding-y) var(--space-sm);min-height:var(--list-row-height);cursor:pointer;font-size:var(--text-base);text-align:left;transition:all .12s ease;}
  .opt:hover{border-color:var(--accent-dim);}
  .opt-letter{width:26px;height:26px;flex:none;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--font-mono);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .opt-text-col{display:flex;flex-direction:column;gap:1px;}
  .opt-def{font-size:var(--text-xs);color:var(--ink-muted);}
  .opt.correct{background:var(--accent-soft);border-color:var(--accent);}
  .opt.correct .opt-letter{background:var(--accent);}

<div id="splash" class="splash-screen">
  <svg class="splash-spark" viewBox="0 0 100 100" width="72" height="72">
    <path d="M50 4 C52.5 36 64 47.5 96 50 C64 52.5 52.5 64 50 96 C47.5 64 36 52.5 4 50 C36 47.5 47.5 36 50 4 Z" fill="var(--accent)"/>

  <div class="splash-sub">為你準備學習旅程…</div>

<div id="root"></div>

<script>
/* ========================= 工具函式 ========================= */
function uid(){return Math.random().toString(36).slice(2,10);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function addDays(dateStr,n){const d=new Date(dateStr+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleOptions(q){
  if(!q||!Array.isArray(q.options)) return q;
  const correctText=q.options[q.correctIndex];
  const newOptions=shuffle(q.options);
  const newCorrectIndex=newOptions.indexOf(correctText);
  return {...q, options:newOptions, correctIndex:newCorrectIndex<0?q.correctIndex:newCorrectIndex};
}
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function wrapWordsForLookup(text){
  if(!text) return '';
  const tokens=String(text).split(/(\s+)/);
  return tokens.map(tok=>{
    if(!tok) return '';
    if(/^\s+$/.test(tok)) return tok;
    const leading=(tok.match(/^[^a-zA-Z]*/)||[''])[0];
    const trailing=(tok.match(/[^a-zA-Z]*$/)||[''])[0];
    const core=tok.slice(leading.length, tok.length-trailing.length || undefined);
    if(!core || !/^[a-zA-Z'-]+$/.test(core) || /^_+$/.test(tok)){
      return escapeHtml(tok);
    }
    const wordArg=core.replace(/'/g,"\\'");
    return `${escapeHtml(leading)}<span class="tap-word" onclick="showWordLookup(event,'${wordArg}')">${escapeHtml(core)}</span>${escapeHtml(trailing)}`;
  }).join('');
}
let wordLookupCache={};
function closeWordLookup(){
  if(window.__activeWordPopover){ window.__activeWordPopover.remove(); window.__activeWordPopover=null; }
  if(window.__activeWordCatcher){ window.__activeWordCatcher.remove(); window.__activeWordCatcher=null; }
}
async function showWordLookup(event,word){
  event.stopPropagation();
  closeWordLookup();
  const rect=event.target.getBoundingClientRect();
  const pop=document.createElement('div');
  pop.className='glass-popover';
  pop.style.position='fixed';
  pop.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-210))+'px';
  pop.style.top=(rect.bottom+8)+'px';
  pop.style.minWidth='140px';
  pop.style.maxWidth='220px';
  pop.style.padding='12px 14px';
  pop.style.zIndex='80';
  function paint(bodyHtml){
    pop.innerHTML=`<div style="font-weight:700;font-family:var(--font-display);font-size:15px;color:var(--ink);" class="speak-word" onclick="event.stopPropagation();speakText('${word.replace(/'/g,"\\'")}')">${escapeHtml(word)}</div>${bodyHtml}`;
  }
  paint(`<div class="muted" style="margin-top:2px;font-size:12.5px;">查詢中…</div>`);
  document.body.appendChild(pop);
  window.__activeWordPopover=pop;
  const catcher=document.createElement('div');
  catcher.className='popover-catcher';
  catcher.style.zIndex='79';
  catcher.onclick=closeWordLookup;
  document.body.appendChild(catcher);
  window.__activeWordCatcher=catcher;

  const key=word.toLowerCase();
  if(wordLookupCache[key]){
    const r=wordLookupCache[key];
    paint(`<div class="muted" style="margin-top:4px;font-size:13px;">${escapeHtml(r.partOfSpeech||'')} ${escapeHtml(r.definition||'')}</div>`);
    return;
  }
  try{
    let result=null;
    let lastErr=null;
    for(let attempt=0;attempt<2 && !result;attempt++){
      try{
        result=await callClaudeRaw(WORD_LOOKUP_SCHEMA_SYS,`請解釋英文單字："${word}"`);
        if(!result||typeof result.definition!=='string'||!result.definition){ result=null; throw new Error('回傳格式不完整'); }
      }catch(err){ lastErr=err; result=null; }
    }
    if(!result) throw lastErr||new Error('查詢失敗');
    wordLookupCache[key]=result;
    if(window.__activeWordPopover===pop){
      paint(`<div class="muted" style="margin-top:4px;font-size:13px;">${escapeHtml(result.partOfSpeech||'')} ${escapeHtml(result.definition||'')}</div>`);
    }
  }catch(e){
    console.error('word lookup failed',word,e);
    if(window.__activeWordPopover===pop){ paint(`<div class="muted" style="margin-top:2px;font-size:12.5px;">查詢失敗，請稍後再試</div>`); }
  }
}
function nowISO(){ return new Date().toISOString(); }
const BOX_INTERVALS_MIN=[5,25,120,480,1440,4320,10080,21600,43200]; // 5分,25分,2小時,8小時,1天,3天,7天,15天,30天
function scheduleSRS(item,correct){
  const maxBox=BOX_INTERVALS_MIN.length-1;
  if(correct){
    item.box=clamp((item.box||0)+1,0,maxBox);
    if(item.box>=maxBox){ item.mastered=true; }
  }else{
    item.box=clamp((item.box||0)-2,0,maxBox);
    item.mastered=false;
  }
  const mins=BOX_INTERVALS_MIN[item.box];
  item.due=new Date(Date.now()+mins*60000).toISOString();
  item.reviewCount=(item.reviewCount||0)+1;
}
function formatDueRelative(dueISO){
  if(!dueISO) return '';
  const diffMs=new Date(dueISO).getTime()-Date.now();
  if(diffMs<=0) return '現在可複習';
  const mins=Math.round(diffMs/60000);
  if(mins<60) return `${mins}分鐘後複習`;
  const hours=Math.round(mins/60);
  if(hours<24) return `${hours}小時後複習`;
  const days=Math.round(hours/24);
  return `${days}天後複習`;
}
function bandToLevel(band){
  if(band<300)return '入門';
  if(band<450)return '初級';
  if(band<600)return '中級';

}
function computeStreak(checkins){
  const set=new Set(checkins||[]);
  const t=todayStr();
  let anchor=set.has(t)?t:addDays(t,-1);
  let streak=0,d=anchor;
  while(set.has(d)){ streak++; d=addDays(d,-1); }
  return streak;
}

       不需要更動這個物件的形狀，畫面渲染邏輯也不用跟著改。 */
    explanation:{
      summary:raw.explanation||'',

      grammar:raw.grammarTip||null,

/* Task 003.1：每題作答後立即更新 Estimated TOEIC Score，而不是像過去那樣，
   只在整輪練習結束時，用「這輪新題的整體正確率」概算一個粗略的加減分。
   分數增減依「這題的難度」而不是固定值，難度來自 Question Object 的 metadata。
   函式刻意拆成三層，是為了讓未來的 Ability Engine（依 Part / Skill / Vocabulary Theme
   個別追蹤能力值）可以直接接在 recordAbilitySignal() 裡，不需要動到分數計算或呼叫端。 */
const SCORE_ENGINE_DELTAS={
  Easy:{correct:2,wrong:-1},
  Medium:{correct:5,wrong:-3},
  Hard:{correct:8,wrong:-5},
  Adaptive:{correct:5,wrong:-3}, // Adaptive 難度目前比照 Medium 計分，待 Ability Engine 上線後可再依個人能力動態調整
};
/* 依 Question Object 的 metadata.difficulty 查出這題答對/答錯各該加減多少分 */
function getScoreDelta(learningObject,correct){
  const diffLabel=(learningObject&&learningObject.metadata&&learningObject.metadata.difficulty)||'Medium';
  const table=SCORE_ENGINE_DELTAS[diffLabel]||SCORE_ENGINE_DELTAS.Medium;
  return correct?table.correct:table.wrong;
}

   part / skills / vocabularyTheme，把這次作答結果累積進對應的能力值。
   目前先不做任何運算，Task 003.1 的範圍只到 Estimated Score。 */
function recordAbilitySignal(learningObject,correct){
  // TODO(Ability Engine): 尚未實作，僅保留介面。
}
/* Score Engine 的唯一對外入口：傳入 profile、完整的 Question Object、以及這題答對與否，
   立即更新 profile.band（並同步 clamp 在 10~990 之間、換算 level），
   之後再呼叫尚未實作的能力紀錄介面，讓架構已經為未來擴充做好準備。 */
function applyScoreEngine(profile,questionObject,correct){
  if(!profile||!questionObject) return;
  const learningObject=questionObject.learningObject||null;
  const delta=getScoreDelta(learningObject,correct);
  profile.band=clamp((profile.band||0)+delta,10,990);
  profile.level=bandToLevel(profile.band);
  recordAbilitySignal(learningObject,correct);
}

function hexToHsl(hex){
  const f=parseInt(hex.slice(1),16);
  let r=(f>>16&255)/255, g=(f>>8&255)/255, b=(f&255)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0,s=0,l=(max+min)/2;
  if(max!==min){
    const d=max-min;
    s=l>0.5?d/(2-max-min):d/(max+min);
    if(max===r) h=(g-b)/d+(g<b?6:0);
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;
  }
  return {h,s,l};
}
function hslToHex(h,s,l){
  h=((h%360)+360)%360;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  const R=Math.round((r+m)*255), G=Math.round((g+m)*255), B=Math.round((b+m)*255);
  return '#'+[R,G,B].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function computeWrongColor(accentHex){
  const {h}=hexToHsl(accentHex);
  const circularDist=(a,b)=>{ const d=Math.abs(a-b)%360; return d>180?360-d:d; };
  const candidates=[0,350,340,330,20,10];
  let best=candidates[0], bestDist=-1;
  for(const c of candidates){
    const d=circularDist(h,c);
    if(d>bestDist){ bestDist=d; best=c; }
  }
  return hslToHex(best,0.62,0.58);
}
function shadeColor(hex,percent){
  try{
    let f=parseInt(hex.slice(1),16),t=percent<0?0:255,p=Math.abs(percent);
    let R=f>>16, G=f>>8&0x00FF, B=f&0x0000FF;
    const newR=Math.round((t-R)*p)+R, newG=Math.round((t-G)*p)+G, newB=Math.round((t-B)*p)+B;
    return '#'+(0x1000000+newR*0x10000+newG*0x100+newB).toString(16).slice(1);
  }catch(e){ return hex; }
}
function hexToRgba(hex,alpha){
  try{
    const f=parseInt(hex.slice(1),16);
    const R=f>>16, G=f>>8&0x00FF, B=f&0x0000FF;
    return `rgba(${R},${G},${B},${alpha})`;
  }catch(e){ return hex; }
}
function applyAccent(hex){
  const root=document.documentElement;
  root.style.setProperty('--accent',hex);
  root.style.setProperty('--accent-dim',shadeColor(hex,-0.22));
  root.style.setProperty('--accent-soft',shadeColor(hex,0.84));
  root.style.setProperty('--accent-soft-text',shadeColor(hex,-0.10));
  root.style.setProperty('--accent-glow-1',hexToRgba(hex,0.38));
  root.style.setProperty('--accent-glow-2',hexToRgba(shadeColor(hex,0.35),0.30));
  root.style.setProperty('--accent-glow-3',hexToRgba(shadeColor(hex,-0.10),0.26));
  root.style.setProperty('--ink-3',hexToRgba(hex,0.14));
  const wrong=computeWrongColor(hex);
  root.style.setProperty('--wrong',wrong);
  root.style.setProperty('--wrong-dim',shadeColor(wrong,-0.22));
  root.style.setProperty('--wrong-soft',shadeColor(wrong,0.82));
  const {l}=hexToHsl(hex);
  const isDarkAccent=l<0.55;
  root.style.setProperty('--hamburger-color', isDarkAccent?'#FFFFFF':'#4E5366');
  root.style.setProperty('--hamburger-glow', isDarkAccent?`drop-shadow(0 0 4px ${hex}) drop-shadow(0 0 8px ${hex})`:'none');
}

const HAS_ARTIFACT_STORAGE = typeof window!=='undefined' && !!window.storage && typeof window.storage.get==='function';
async function storageGet(key,fallback){
  if(HAS_ARTIFACT_STORAGE){
    try{
      const r=await window.storage.get(key,false);
      return r?JSON.parse(r.value):fallback;
    }catch(e){ /* 找不到key或暫時性錯誤時，往下嘗試 localStorage 備援 */ }
  }
  try{
    const raw=localStorage.getItem('toeic_'+key);
    return raw?JSON.parse(raw):fallback;
  }catch(e){ return fallback; }
}
async function storageSet(key,value){
  if(HAS_ARTIFACT_STORAGE){
    try{ await window.storage.set(key,JSON.stringify(value),false); return; }catch(e){ console.error('storage set failed',key,e); }
  }
  try{ localStorage.setItem('toeic_'+key,JSON.stringify(value)); }catch(e){ console.error('localStorage set failed',key,e); }
}

/* ========================= Claude API ========================= */
async function callClaudeRaw(systemPrompt,userPrompt){
  const response=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      system:systemPrompt,
      messages:[{role:'user',content:userPrompt}]
    })
  });
  const data=await response.json();
  const text=(data.content||[]).map(b=>b.text||'').join('\n');
  const clean=text.replace(/```json/gi,'').replace(/```/g,'').trim();
  return JSON.parse(clean);
}
async function callClaudeJSON(systemPrompt,userPrompt){
  const parsed=await callClaudeRaw(systemPrompt,userPrompt);
  if(!parsed.questions||!Array.isArray(parsed.questions)) throw new Error('格式錯誤');
  return parsed.questions;
}

function buildWeakText(profile){
  const cs=profile.categoryStats||{};
  function acc(cat){const s=cs[cat];if(!s||s.total===0)return null;return Math.round(100*s.correct/s.total);}
  const vAcc=acc('vocabulary'), gAcc=acc('grammar');
  if(vAcc===null&&gAcc===null) return '目前尚無足夠紀錄,題目類別均衡出即可。';
  const parts=[];
  if(vAcc!==null) parts.push(`vocabulary正確率${vAcc}%`);
  if(gAcc!==null) parts.push(`grammar正確率${gAcc}%`);
  return `使用者類別正確率：${parts.join('、')}。正確率較低的類別題目請略多。`;
}
function pickTargetVocab(n){
  const sorted=[...STATE.vocab].filter(v=>!v.mastered).sort((a,b)=>{
    if(a.due<b.due) return -1;
    if(a.due>b.due) return 1;
    return (a.box||0)-(b.box||0);
  });
  return sorted.slice(0,n).map(v=>({word:v.word,definition:v.definition}));
}
function buildTargetVocabText(targetVocab){
  if(!targetVocab||targetVocab.length===0) return '';
  return `使用者單字本中待加強的單字：${targetVocab.map(v=>v.word).join('、')}。請讓其中1-2題直接以這些單字作為考點(vocabWord.word需等於其中一個)。`;
}

async function batchGenerate(genFn, totalCount, chunkSize){
  let remaining=totalCount;
  const out=[];
  while(remaining>0){
    const n=Math.min(chunkSize,remaining);
    const batch=await genFn(n);
    out.push(...batch);
    remaining-=n;
  }
  return out;
}
async function collectUniqueGroups(genFn,targetCount,keyFn){
  const groups=[];
  const seen=new Set();
  const maxAttempts=targetCount+2;
  for(let i=0;i<maxAttempts && groups.length<targetCount;i++){
    const g=await genFn();
    const key=keyFn(g);
    if(seen.has(key)) continue;
    seen.add(key);
    groups.push(g);
  }
  return groups;
}

/* 同一段落/音檔對應多題時，難度依「題目在此單元中的順序」遞增，
   而不是每一小題都寫死同一個數字，這樣圓點才會確實反映目前是第幾題。 */
function difficultyByPosition(index,total){
  const base=Math.max(1,3-Math.floor((total-1)/2));
  return clamp(base+index,1,5);
}

      if(!parsed.passage||!parsed.questions||parsed.questions.length<2) throw new Error('格式錯誤');
      return {passages:[parsed.passage],questions:parsed.questions};
    }
    if(!parsed.passages||parsed.passages.length<passageCount||!parsed.questions||parsed.questions.length<passageCount) throw new Error('格式錯誤');
    return {passages:parsed.passages,questions:parsed.questions};
  }catch(e){
    console.error(e);
    const fb=shuffle(FALLBACK_READING_GROUPS)[0];
    return {passages:[fb.passage],questions:fb.questions};
  }
}
function groupToReadingItems(group){

async function generateSpeakingPrompts(profile,count){

async function generateScenarioQuestions(profile,scenario,count){

function buildReviewQueue(categoryFilter,maxTotal,includeVocab){
  maxTotal = maxTotal||4;
  includeVocab = includeVocab!==false;
  const t=nowISO();
  let dueVocab=[];
  let vocabTake=0;
  if(includeVocab){
    const dueVocabAll=STATE.vocab.filter(v=>!v.mastered && v.due<=t).sort((a,b)=>a.due<b.due?-1:1);
    vocabTake=Math.min(2,dueVocabAll.length,maxTotal);
    dueVocab=dueVocabAll.slice(0,vocabTake).map(v=>({kind:'vocabReview',ref:v}));
  }
  let dueMistakesAll=STATE.mistakes.filter(m=>!m.mastered && m.due<=t);
  if(categoryFilter) dueMistakesAll=dueMistakesAll.filter(m=>m.category===categoryFilter);
  dueMistakesAll=dueMistakesAll.sort((a,b)=>a.due<b.due?-1:1);
  const mistakeTake=Math.max(0,maxTotal-vocabTake);
  const dueMistakes=dueMistakesAll.slice(0,mistakeTake).map(m=>({kind:'mistake',ref:m}));
  return [...dueVocab,...dueMistakes];
}
function buildVocabQuizItems(count){
  const t=nowISO();
  const pool=STATE.vocab.filter(v=>!v.mastered);
  if(pool.length<4) return null;
  const due=pool.filter(v=>v.due<=t);
  const rest=pool.filter(v=>v.due>t);
  const ordered=[...due,...rest].slice(0,count);
  return ordered.map(v=>{
    const distractorPool=shuffle(STATE.vocab.filter(x=>x.id!==v.id && x.definition));
    let distractors=distractorPool.slice(0,3).map(x=>x.definition);
    while(distractors.length<3) distractors.push('（無相關選項）');
    const options=shuffle([v.definition||'（無定義）',...distractors]);
    const correctIndex=options.indexOf(v.definition||'（無定義）');
    const q={id:uid(),vocabId:v.id,word:v.word,question:`「${v.word}」最接近下列何者的意思？`,options,correctIndex,explanation:v.example?`例句：${v.example}`:'',category:'vocabQuiz',difficulty:null};
    return {kind:'vocabQuiz',ref:q};
  });
}
function buildWordCardItems(count){
  const t=nowISO();
  const pool=STATE.vocab.filter(v=>!v.mastered && v.definition);
  if(pool.length<4) return null;
  const due=pool.filter(v=>v.due<=t);
  const rest=pool.filter(v=>v.due>t);
  const ordered=[...due,...rest].slice(0,count);
  return ordered.map(v=>{
    const distractorPool=shuffle(STATE.vocab.filter(x=>x.id!==v.id && x.word)).slice(0,3);
    let distractors=distractorPool.map(x=>x.word);
    while(distractors.length<3) distractors.push('word');
    const options=shuffle([v.word,...distractors]);
    const correctIndex=options.indexOf(v.word);
    const q={id:uid(),vocabId:v.id,question:v.definition,options,correctIndex,explanation:v.example?`例句：${v.example}`:'',category:'wordCard',difficulty:null};
    return {kind:'wordCard',ref:q};
  });
}

  render();

    recording:false,transcript:'',speakingGraded:false,speakingScore:null,speakingFeedback:'',micError:null};

  try{

      const newItems=[...readingQs.map(q=>({kind:'new',ref:q})),...listeningQs.map(q=>({kind:'newListening',ref:q}))];
      STATE.session.queue=[...reviewItems,...newItems];
    }else if(mode==='listening'){
      const reviewItems=buildReviewQueue('listening',4);
      const targetVocab=pickTargetVocab(4);
      const newTotal=Math.max(0,10-reviewItems.length);
      const listeningQs=newTotal>0?await batchGenerate(n=>generateListeningQuestions(STATE.profile,n,targetVocab),newTotal,5):[];
      STATE.session.queue=[...reviewItems,...listeningQs.map(q=>({kind:'newListening',ref:q}))];
    }else if(mode==='grammar'){
      const reviewItems=buildReviewQueue('grammar',4);
      const targetVocab=pickTargetVocab(4);
      const newTotal=Math.max(0,10-reviewItems.length);
      const grammarQs=newTotal>0?await batchGenerate(n=>generateGrammarQuestions(STATE.profile,n,targetVocab),newTotal,5):[];
      STATE.session.queue=[...reviewItems,...grammarQs.map(q=>({kind:'new',ref:q}))];
    }else if(mode==='vocabQuiz'){
      STATE.session.queue=buildVocabQuizItems(10)||[];
    }else if(mode==='wordCard'){
      STATE.session.queue=buildWordCardItems(10)||[];
    }else if(mode==='speaking'){
      const prompts=await batchGenerate(n=>generateSpeakingPrompts(STATE.profile,n),10,5);
      STATE.session.queue=prompts.map(p=>({kind:'speaking',ref:p}));
    }else if(mode==='scenario'){
      const key=scenario||'daily_shopping';
      const reviewItems=buildReviewQueue(key,4,false);
      const newTotal=Math.max(0,10-reviewItems.length);
      const qs=newTotal>0?await batchGenerate(n=>generateScenarioQuestions(STATE.profile,key,n),newTotal,4):[];
      STATE.session.queue=[...reviewItems,...qs.map(q=>({kind:'new',ref:q}))];
    }else if(mode==='part6'){
      const reviewItems=buildReviewQueue('part6',3,false);
      const groups=await collectUniqueGroups(()=>generatePart6Group(STATE.profile),3,g=>g.passage);
      const newItems=groups.flatMap(g=>part6GroupToItems(g)).map(q=>({kind:'new',ref:q}));
      STATE.session.queue=[...reviewItems,...newItems];
    }else if(mode==='conversation'){
      const reviewItems=buildReviewQueue('conversation',3,false);

      const newItems=groups.flatMap(g=>groupToListeningItems(g,'conversation')).map(q=>({kind:'newListening',ref:q}));
      STATE.session.queue=[...reviewItems,...newItems];
    }else if(mode==='talk'){
      const reviewItems=buildReviewQueue('talk',3,false);
      const groups=await collectUniqueGroups(()=>generateGroupedListening(TALK_SCHEMA_SYS,STATE.profile,FALLBACK_TALKS),3,g=>g.audioScript);
      const newItems=groups.flatMap(g=>groupToListeningItems(g,'talk')).map(q=>({kind:'newListening',ref:q}));
      STATE.session.queue=[...reviewItems,...newItems];
    }else if(mode==='reading'){
      const reviewItems=buildReviewQueue('reading',4,false);
      const groups=await collectUniqueGroups(()=>generateReadingGroup(STATE.profile,1),5,g=>g.passages.join('|'));
      const newItems=groups.flatMap(g=>groupToReadingItems(g)).map(q=>({kind:'new',ref:q}));
      STATE.session.queue=[...reviewItems,...newItems];
    }else if(mode==='readingMulti'){
      const reviewItems=buildReviewQueue('reading',3,false);
      const groups=await collectUniqueGroups(()=>generateReadingGroup(STATE.profile, Math.random()<0.5?2:3),3,g=>g.passages.join('|'));
      const newItems=groups.flatMap(g=>groupToReadingItems(g)).map(q=>({kind:'new',ref:q}));
      STATE.session.queue=[...reviewItems,...newItems];
    }else if(mode==='photo'){
      const reviewItems=buildReviewQueue('photo',3,false);
      const newTotal=Math.max(0,8-reviewItems.length);
      const qs=newTotal>0?await batchGenerate(n=>generatePhotoQuestions(STATE.profile,n),newTotal,4):[];
      STATE.session.queue=[...reviewItems,...qs.map(q=>({kind:'new',ref:q}))];
    }
  }catch(e){ console.error(e); }

  STATE.loading=false;
  if(!STATE.session.queue.length){
    STATE.error='題目產生失敗,請稍後再試一次。';
    STATE.view='dashboard';
    render();
    return;
  }
  STATE.view='session';
  render();
}

function currentSessionItem(){ return STATE.session.queue[STATE.session.index]; }

function selectSessionAnswer(idx){
  const s=STATE.session;
  if(s.answered) return;
  s.selected=idx; s.answered=true;
  s.lastDueInfo=null;
  const item=currentSessionItem();
  const q=item.ref;
  const correct=idx===q.correctIndex;

  if(correct) playCorrectSound(); else playWrongSound();
  if(item.kind!=='vocabQuiz'){ speakOptionDelayed(q.options[q.correctIndex]); }

  if(item.kind==='new'||item.kind==='newListening'){ s.newTotal++; if(correct)s.newCorrect++; applyScoreEngine(STATE.profile,q,correct); }
  if(item.kind==='mistake'){ s.reviewTotal++; if(correct)s.reviewCorrect++; scheduleSRS(item.ref,correct); s.lastDueInfo=item.ref.due; }
  if(item.kind==='vocabQuiz'||item.kind==='wordCard'){
    s.reviewTotal++; if(correct)s.reviewCorrect++;
    const v=STATE.vocab.find(x=>x.id===q.vocabId);
    if(v){ scheduleSRS(v,correct); s.lastDueInfo=v.due; }
  }

  if(item.kind==='new'||item.kind==='newListening'){
    const catKey=q.category;
    const cs=STATE.profile.categoryStats[catKey]||(STATE.profile.categoryStats[catKey]={correct:0,total:0});
    cs.total++; if(correct)cs.correct++;
  }

  if(!correct && q.vocabWord && (item.kind==='new'||item.kind==='newListening'||item.kind==='mistake')){
    const added=autoRecordVocab(q.vocabWord);
    if(added) s.vocabAutoAdded.push(q.vocabWord.word);
  }

  if(!correct && (item.kind==='new'||item.kind==='newListening')){
    const m={id:uid(),question:q.question||'',audioScript:q.audioScript||null,passage:q.passage||null,passages:q.passages||null,sceneTag:q.sceneTag||null,options:q.options,correctIndex:q.correctIndex,
      explanation:q.explanation,category:q.category,difficulty:q.difficulty||2,vocabWord:q.vocabWord||null,grammarTip:q.grammarTip||null,
      box:0,due:new Date(Date.now()+5*60000).toISOString(),mastered:false,createdAt:todayStr(),reviewCount:0};
    STATE.mistakes.push(m);
    s.lastDueInfo=m.due;
  }
  render();
}

/* ---- 口說錄音 ---- */
async function startRecording(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    STATE.session.micError='此瀏覽器不支援語音辨識';
    render();
    return;
  }
  if(!window.isSecureContext){
    STATE.session.micError='需要安全連線(HTTPS)才能使用麥克風';
    render();
    return;
  }
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      stream.getTracks().forEach(t=>t.stop());
    }catch(e){
      console.error(e);
      const name=e&&e.name;
      STATE.session.micError = (name==='NotAllowedError'||name==='PermissionDeniedError') ? '麥克風權限被拒絕，請允許瀏覽器存取麥克風，或改用文字輸入'
        : name==='NotFoundError' ? '找不到可用的麥克風裝置，請改用文字輸入'
        : '此環境不允許存取麥克風，請改用文字輸入';
      render();
      return;
    }
  }
  try{
    recognizer=new SR();
    recognizer.lang='en-US';
    recognizer.interimResults=true;
    recognizer.maxAlternatives=1;
    recognizer.continuous=false;
    STATE.session.transcript='';
    STATE.session.recording=true;
    STATE.session.micError=null;
    recognizer.onresult=(e)=>{
      let text='';
      for(let i=0;i<e.results.length;i++){ text+=e.results[i][0].transcript; }
      STATE.session.transcript=text;
      render();
    };
    recognizer.onerror=(e)=>{
      STATE.session.recording=false;
      const code=e&&e.error;
      STATE.session.micError = code==='not-allowed'||code==='service-not-allowed' ? '麥克風權限被拒絕，請改用文字輸入'
        : code==='no-speech' ? '沒有偵測到聲音，請再試一次，或改用文字輸入'
        : code==='network' ? '語音辨識服務連線失敗，請改用文字輸入'
        : `語音辨識發生問題（${escapeHtml(code||'未知錯誤')}），請改用文字輸入`;
      render();
    };
    recognizer.onend=()=>{ STATE.session.recording=false; render(); };
    render();
    recognizer.start();
  }catch(e){
    console.error(e);
    STATE.session.recording=false;
    STATE.session.micError='無法啟動麥克風，請改用文字輸入';
    render();
  }
}
function stopRecording(){
  if(recognizer){ try{ recognizer.stop(); }catch(e){} }
  STATE.session.recording=false;
  render();
}

function speakText(text,rate){

  try{
    window.speechSynthesis.cancel();
    const utter=new SpeechSynthesisUtterance(text);
    utter.lang='en-US'; utter.rate=rate||0.9;
    window.speechSynthesis.speak(utter);
  }catch(e){ console.error(e); }
}
let cachedVoices=null;
function getEnglishVoices(){
  if(!supportsSpeechSynthesis()) return [];
  const voices=window.speechSynthesis.getVoices()||[];
  return voices.filter(v=>/^en/i.test(v.lang));
}
function pickDialogueVoices(){
  const voices=cachedVoices&&cachedVoices.length?cachedVoices:getEnglishVoices();
  if(voices.length) cachedVoices=voices;
  const female=voices.find(v=>/female|woman|zira|samantha|victoria|karen|moira|tessa|susan|salli|joanna/i.test(v.name));
  const male=voices.find(v=>/male|man|david|alex|daniel|fred|george|mark|guy/i.test(v.name));
  return {
    M: male || voices[0] || null,
    W: female || voices[1] || voices[0] || null,
  };
}
function isDialogueScript(text){ return /^\s*[MW]\s*:/m.test(text||''); }
function speakDialogue(text,rate){
  if(!text||!supportsSpeechSynthesis()) return;
  try{
    window.speechSynthesis.cancel();
    const voices=pickDialogueVoices();
    const lines=text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
    lines.forEach(line=>{
      const m=line.match(/^([MW])\s*:\s*(.+)$/);
      const utter=new SpeechSynthesisUtterance(m?m[2]:line);
      utter.lang='en-US'; utter.rate=rate||0.9;
      if(m){
        const speaker=m[1];
        const v=speaker==='M'?voices.M:voices.W;
        if(v) utter.voice=v;
        utter.pitch = speaker==='M' ? 0.72 : 1.4;
      }
      window.speechSynthesis.speak(utter);
    });
  }catch(e){ console.error(e); }
}
function speakOptionDelayed(text){
  if(!text) return;
  setTimeout(()=>speakText(text),380);
}
/* ---- 答對/答錯音效（Web Audio 合成，無需外部音檔） ---- */
let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  return audioCtx;
}
function playTone(freq,duration,type,delay,gainVal){
  const ctx=getAudioCtx();
  if(!ctx) return;
  try{
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type=type||'sine';
    osc.frequency.value=freq;
    osc.connect(gain); gain.connect(ctx.destination);
    const startTime=ctx.currentTime+(delay||0);
    gain.gain.setValueAtTime(gainVal||0.15, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime+duration);
    osc.start(startTime);
    osc.stop(startTime+duration+0.02);
  }catch(e){}
}
function playCorrectSound(){ playTone(660,0.12,'sine',0,0.14); playTone(880,0.16,'sine',0.11,0.14); }
function playWrongSound(){ playTone(220,0.24,'sawtooth',0,0.10); }
let splashChimePlayed=false;
function playSplashChimeNow(){
  const ctx=getAudioCtx();
  if(!ctx || ctx.state!=='running') return;
  try{
    const now=ctx.currentTime;
    const freqs=[392,523.25,659.25,783.99,1046.5];
    freqs.forEach((f,i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='sine';
      osc.frequency.value=f;
      osc.connect(gain); gain.connect(ctx.destination);
      const start=now+i*0.09;
      gain.gain.setValueAtTime(0,start);
      gain.gain.linearRampToValueAtTime(0.08,start+0.05);
      gain.gain.exponentialRampToValueAtTime(0.001,start+1.1);
      osc.start(start); osc.stop(start+1.2);
    });
    const swell=ctx.createOscillator();
    const swellGain=ctx.createGain();
    swell.type='sine';
    swell.frequency.setValueAtTime(1200,now);
    swell.frequency.exponentialRampToValueAtTime(2400,now+1.0);
    swell.connect(swellGain); swellGain.connect(ctx.destination);
    swellGain.gain.setValueAtTime(0,now);
    swellGain.gain.linearRampToValueAtTime(0.018,now+0.3);
    swellGain.gain.exponentialRampToValueAtTime(0.001,now+1.3);
    swell.start(now); swell.stop(now+1.3);
  }catch(e){}
}
function playSplashChime(){
  if(splashChimePlayed) return;
  const ctx=getAudioCtx();
  if(!ctx) return;
  if(ctx.state==='running'){
    splashChimePlayed=true;
    playSplashChimeNow();
  }else if(ctx.state==='suspended'){
    // 這裡是在使用者點擊「繼續」按鈕之後呼叫，屬於使用者手勢範圍內，可以直接解鎖播放
    ctx.resume().then(()=>{
      if(!splashChimePlayed && ctx.state==='running'){
        splashChimePlayed=true;
        playSplashChimeNow();
      }
    }).catch(()=>{});
  }
}

function playCurrentAudio(){
  let text=null;
  if(STATE.view==='session'){
    const item=currentSessionItem();
    if(item&&item.ref&&item.ref.audioScript) text=item.ref.audioScript;
  }else if(STATE.view==='placement'){
    const q=STATE.placement.questions[STATE.placement.index];
    if(q&&q.audioScript) text=q.audioScript;
  }else if(STATE.view==='mistakeBook'&&STATE.expandedMistake){
    const m=STATE.mistakes.find(x=>x.id===STATE.expandedMistake);
    if(m&&m.audioScript) text=m.audioScript;
  }
  if(text&&isDialogueScript(text)){
    speakDialogue(text,STATE.settings.speechRate||1.0);
  }else{
    speakText(text,STATE.settings.speechRate||1.0);
  }
}
function cycleSpeechRate(){
  const rates=[0.8,1.0];
  const cur=STATE.settings.speechRate||1.0;
  let idx=rates.indexOf(cur);
  idx=(idx+1)%rates.length;
  STATE.settings.speechRate=rates[idx];
  storageSet('settings',STATE.settings);
  render();
}

async function finishSession(){
  const s=STATE.session;
  const profile=STATE.profile;
  profile.totalAnswered+=s.newTotal+s.reviewTotal;
  profile.totalCorrect+=s.newCorrect+s.reviewCorrect;
  if(s.mode==='speaking'){
    const valid=s.speakingResults.filter(r=>typeof r.score==='number');
    profile.speakingCount=(profile.speakingCount||0)+valid.length;
    profile.speakingScoreSum=(profile.speakingScoreSum||0)+valid.reduce((a,r)=>a+r.score,0);
  }
  const t=todayStr();
  if(!profile.checkins) profile.checkins=[];
  if(!profile.checkins.includes(t)) profile.checkins.push(t);
  profile.streak=computeStreak(profile.checkins);

  STATE.profile=profile;
  await storageSet('profile',profile);
  await storageSet('mistakes',STATE.mistakes);
  await storageSet('vocab',STATE.vocab);
  STATE.view='sessionResult';
  render();
}

function toggleExpandMistake(id){
  if(STATE.expandedMistake===id){
    const m=STATE.mistakes.find(x=>x.id===id);
    if(m) delete m._selected;
    STATE.expandedMistake=null;
  }else{ STATE.expandedMistake=id; }
  render();
}
async function retestMistake(id,idx){
  const m=STATE.mistakes.find(x=>x.id===id);
  if(!m||m._selected!==undefined) return;
  m._selected=idx;
  const correct=idx===m.correctIndex;
  if(correct) playCorrectSound(); else playWrongSound();
  speakOptionDelayed(m.options[m.correctIndex]);
  scheduleSRS(m,correct);
  const clean=STATE.mistakes.map(x=>{const {_selected,...rest}=x; return rest;});
  await storageSet('mistakes',clean);
  render();
}

function withDissolve(fn){
  const root=document.getElementById('root');
  if(!root){ fn(); return; }
  root.classList.remove('materializing-root');
  root.classList.add('dissolving');
  setTimeout(()=>{
    fn();
    const newRoot=document.getElementById('root');
    if(newRoot){
      newRoot.classList.remove('dissolving');
      void newRoot.offsetWidth;
      newRoot.classList.add('materializing-root');
      setTimeout(()=>{ newRoot.classList.remove('materializing-root'); },380);
    }
  },280);
}
function goto(view){
  if(STATE.view===view){ return; }
  withDissolve(()=>{
    clearTimeout(window.__profileHoverTimer);
    clearTimeout(window.__learnHoverTimer);
    STATE.view=view; STATE.expandedMistake=null; STATE.flippedCard=null; STATE.error=null; STATE.colorPickerOpen=false; STATE.profileExpanded=null; STATE.learnExpanded=null;
    render();
  });
}

function getDynamicGreeting(){
  if(STATE.sessionGreeting) return STATE.sessionGreeting;
  const now=new Date();
  const hour=now.getHours();
  const day=now.getDay();
  const pf=STATE.profile;
  const candidates=[];
  if(hour<5) candidates.push('夜深了');
  else if(hour<11) candidates.push('早安');
  else if(hour<14) candidates.push('午安');
  else if(hour<18) candidates.push('下午好');
  else candidates.push('晚安');
  if(day===5) candidates.push('週五愉快');
  if(day===6||day===0) candidates.push('週末愉快');
  if(pf && (pf.streak||0)>=2) candidates.push('歡迎回來');
  candidates.push('準備好今天的英文了嗎');
  candidates.push('很高興再見到你');
  const pick=candidates[Math.floor(Math.random()*candidates.length)];
  STATE.sessionGreeting=pick;
  return pick;
}
function getAIInsight(profile){
  if(!profile) return {short:'今天適合全面複習',reason:'AI 會依你的程度混合聽力、文法與單字出題',focusLabel:null,focusKey:null};
  const cs=profile.categoryStats||{};
  function acc(cat){ const s=cs[cat]; if(!s||s.total<3) return null; return Math.round(100*s.correct/s.total); }
  const cats=[['vocabulary','單字'],['grammar','文法'],['listening','聽力']];
  let weakest=null;
  cats.forEach(([key,label])=>{
    const a=acc(key);
    if(a!==null && (weakest===null || a<weakest.acc)){ weakest={key,label,acc:a}; }
  });
  if(weakest && weakest.acc<70){
    return {short:`今天先加強${weakest.label}`,reason:`AI 發現你的${weakest.label}正確率是 ${weakest.acc}%，今天的練習會多帶一點這個部分`,focusLabel:weakest.label,focusKey:weakest.key};
  }
  if((profile.streak||0)>=3){
    return {short:'你已經連續學習好幾天了',reason:'保持這個節奏，AI 會依你的狀況微調難度',focusLabel:null,focusKey:null};
  }
  return {short:'今天適合全面複習',reason:'AI 會依你的程度混合聽力、文法與單字出題',focusLabel:null,focusKey:null};
}

function hexToHsv(hex){
  const f=parseInt(hex.slice(1),16);
  const r=(f>>16&255)/255,g=(f>>8&255)/255,b=(f&255)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60; if(h<0)h+=360;
  }
  const s=max===0?0:d/max;
  const v=max;
  return {h,s,v};
}
function hsvToHex(h,s,v){
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  const R=Math.round((r+m)*255),G=Math.round((g+m)*255),B=Math.round((b+m)*255);
  return '#'+[R,G,B].map(n=>n.toString(16).padStart(2,'0')).join('');
}

function svSquarePointer(e){
  const el=document.getElementById('svSquare');
  if(!el) return;
  const rect=el.getBoundingClientRect();
  const pt=e.touches?e.touches[0]:e;
  let x=pt.clientX-rect.left, y=pt.clientY-rect.top;
  x=Math.max(0,Math.min(rect.width,x));
  y=Math.max(0,Math.min(rect.height,y));
  const s=rect.width?x/rect.width:0, v=rect.height?1-y/rect.height:0;
  STATE.pickerHSV.s=s; STATE.pickerHSV.v=v;
  const hex=hsvToHex(STATE.pickerHSV.h,s,v);
  STATE.settings.accent=hex;
  applyAccent(hex);
  const cursor=el.querySelector('.sv-cursor');
  if(cursor){
    cursor.style.left=(s*100).toFixed(1)+'%';
    cursor.style.top=((1-v)*100).toFixed(1)+'%';
    cursor.style.background=hex;
  }
  const hexInput=document.querySelector('.hex-input');
  if(hexInput && document.activeElement!==hexInput) hexInput.value=hex.toUpperCase();
  document.querySelectorAll('.color-swatch').forEach(sw=>sw.classList.remove('active'));
  if(e.cancelable) e.preventDefault();
}
function updateHue(val){
  STATE.pickerHSV.h=Number(val);
  const hex=hsvToHex(STATE.pickerHSV.h,STATE.pickerHSV.s,STATE.pickerHSV.v);

  applyAccent(hex);

  if(sq){
    sq.style.backgroundColor=`hsl(${Math.round(STATE.pickerHSV.h)},100%,50%)`;
    const cursor=sq.querySelector('.sv-cursor');
    if(cursor) cursor.style.background=hex;
  }
  const hexInput=document.querySelector('.hex-input');
  if(hexInput && document.activeElement!==hexInput) hexInput.value=hex.toUpperCase();
  document.querySelectorAll('.color-swatch').forEach(sw=>sw.classList.remove('active'));
}

function getSessionStageLabel(item){
  if(item.kind==='vocabReview') return '單字複習';
  if(item.kind==='speaking') return '口說';
  const info=catBadgeInfo(item.ref.category);
  return info.label || '練習';
}
function renderSessionJourney(s){
  const stages=[];
  const seen=new Set();
  s.queue.forEach(item=>{
    const label=getSessionStageLabel(item);
    if(!seen.has(label)){ seen.add(label); stages.push(label); }
  });
  if(stages.length<2) return '';
  const currentLabel=getSessionStageLabel(s.queue[s.index]);
  const currentIdx=stages.indexOf(currentLabel);
  return `<div class="journey-steps">
    ${stages.map((label,i)=>{
      const cls=i<currentIdx?'done':i===currentIdx?'current':'';
      return `<span class="journey-step ${cls}">${i<currentIdx?'✓ ':''}${escapeHtml(label)}</span>`;
    }).join('<span class="journey-arrow">›</span>')}
  </div>`;
}
function renderSession(){
  const s=STATE.session;
  const item=currentSessionItem();
  const pct=s.queue.length>1?Math.round((s.index/(s.queue.length-1))*100):100;
  if(item.kind==='vocabReview'){
    return `${renderTopbar()}
      ${renderSessionJourney(s)}
      <div class="progress-label">第 ${s.index+1} / ${s.queue.length} 項・單字複習</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${renderVocabReviewItem(item.ref,s)}`;
  }
  if(item.kind==='speaking'){
    return `${renderTopbar()}${renderSessionJourney(s)}${renderSpeakingItem(item.ref,s)}`;
  }
  const isReview=item.kind==='mistake';
  return `${renderTopbar()}
    ${renderSessionJourney(s)}
    <div class="progress-label">第 ${s.index+1} / ${s.queue.length} 題${isReview?'・複習':''}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${renderChoiceCard(item.ref,item.kind,s)}`;
}
function renderSessionResult(){
  const s=STATE.session;
  const pf=STATE.profile;
  const totalAnswered=s.newTotal+s.reviewTotal;
  const totalCorrect=s.newCorrect+s.reviewCorrect;
  const isSpeaking=s.mode==='speaking';
  return `

      <div class="muted" style="text-transform:uppercase;letter-spacing:0.1em;font-size:11px;">本次練習完成</div>
      ${isSpeaking?
        `<div style="font-family:var(--font-mono);font-size:40px;font-weight:600;color:var(--teal);margin:8px 0;">${s.speakingResults.length} 題</div>
         <p class="muted">已完成口說練習，平均建議分數：${(()=>{const v=s.speakingResults.filter(r=>typeof r.score==='number');return v.length?(v.reduce((a,r)=>a+r.score,0)/v.length).toFixed(1)+' / 5':'－';})()}</p>`
        :
        `<div style="font-family:var(--font-mono);font-size:40px;font-weight:600;color:var(--teal);margin:8px 0;">${totalCorrect} / ${totalAnswered}</div>
         <p class="muted">新題目正確率 ${s.newTotal?Math.round(100*s.newCorrect/s.newTotal):0}%・複習正確率 ${s.reviewTotal?Math.round(100*s.reviewCorrect/s.reviewTotal):'－'}%</p>
         <p class="muted">目前估計分數：<strong style="color:var(--accent);">${pf.band}</strong>（${pf.level}）</p>`
      }
      ${s.vocabAutoAdded.length?`<p class="muted">本次自動加入個人單字卡：${s.vocabAutoAdded.map(escapeHtml).join('、')}</p>`:''}
      <p class="muted">連續簽到 <strong style="color:var(--accent);">${pf.streak||0}</strong> 天</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="goto('dashboard')">回到首頁</button>
        <button class="btn btn-ghost" onclick="startSession('${s.mode}'${s.scenario?`,'${s.scenario}'`:''})">再練一輪</button>
      </div>
    </div>
  `;
}

/* ========================= Render：錯題本 ========================= */
function renderMistakeBook(){
  const t=nowISO();
  let items=STATE.mistakes;
  if(STATE.mistakeFilter==='due') items=items.filter(m=>!m.mastered&&m.due<=t);
  else if(STATE.mistakeFilter==='mastered') items=items.filter(m=>m.mastered);
  if(STATE.mistakeCategoryFilter && STATE.mistakeCategoryFilter!=='all'){
    if(STATE.mistakeCategoryFilter==='scenario') items=items.filter(m=>!!SCENARIO_LABELS[m.category]);
    else items=items.filter(m=>m.category===STATE.mistakeCategoryFilter);
  }
  items=[...items].sort((a,b)=>a.due<b.due?-1:1);

  return `
    ${renderTopbar()}
    <h1 style="font-size:20px;">Mistakes</h1>
    <p class="muted">答錯的題目會排入間隔複習：越常答對，下次出現的間隔就越長，最長30天；越不熟練則間隔越短，最短5分鐘。</p>
    <div class="filter-row">
      <button class="filter-chip ${STATE.mistakeFilter==='due'?'active':''}" onclick="setMistakeFilter('due')">待複習</button>
      <button class="filter-chip ${STATE.mistakeFilter==='all'?'active':''}" onclick="setMistakeFilter('all')">全部</button>
      <button class="filter-chip ${STATE.mistakeFilter==='mastered'?'active':''}" onclick="setMistakeFilter('mastered')">已精熟</button>
    </div>
    <div class="filter-row">
      <button class="filter-chip ${(!STATE.mistakeCategoryFilter||STATE.mistakeCategoryFilter==='all')?'active':''}" onclick="setMistakeCategoryFilter('all')">全部類別</button>
      <button class="filter-chip ${STATE.mistakeCategoryFilter==='vocabulary'?'active':''}" onclick="setMistakeCategoryFilter('vocabulary')">單字</button>
      <button class="filter-chip ${STATE.mistakeCategoryFilter==='grammar'?'active':''}" onclick="setMistakeCategoryFilter('grammar')">文法</button>
      <button class="filter-chip ${STATE.mistakeCategoryFilter==='listening'?'active':''}" onclick="setMistakeCategoryFilter('listening')">聽力</button>
      <button class="filter-chip ${STATE.mistakeCategoryFilter==='scenario'?'active':''}" onclick="setMistakeCategoryFilter('scenario')">情境</button>
    </div>
    ${items.length===0?`<div class="empty">這個分類目前沒有題目。</div>`:
    items.map(m=>{
      const expanded=STATE.expandedMistake===m.id;
      const info=catBadgeInfo(m.category);
      const rawText=m.question||m.audioScript||'';
      const preview=rawText.slice(0,60);
      const rate=STATE.settings.speechRate||1.0;
      const canSpeakSentence=supportsSpeechSynthesis() && !!m.question && !m.audioScript && !isReadingOnlyCategory(m.category);
      return `<div class="list-item" onclick="toggleExpandMistake('${m.id}')">
        <div class="list-item-top">
          <div class="list-item-q" id="mistake-text-${m.id}">${escapeHtml(expanded?rawText:preview)}${(!expanded && preview.length>=60)?'…':''}</div>
          <span style="display:flex;align-items:center;gap:6px;flex:none;">
            ${expanded && canSpeakSentence?`<button class="icon-btn" title="播放整句" onclick="event.stopPropagation();speakText(document.getElementById('mistake-text-${m.id}').textContent.replace(/_+/g,' blank '),${rate})">🔊</button>
            <button class="speed-btn" onclick="event.stopPropagation();cycleSpeechRate()" title="調整播放速度">${rate.toFixed(1)}x</button>`:''}
            <span class="badge ${info.cls}">${info.label}</span>
          </span>
        </div>
        <div class="list-item-meta">熟練度 ${m.box||0}/8 ・ ${m.mastered?'已精熟':formatDueRelative(m.due)} ・ 複習過 ${m.reviewCount||0} 次</div>
        ${expanded?`<div class="expand" onclick="event.stopPropagation()">
          ${m.passages?m.passages.map(p=>renderPassageBlockDark(p)).join(''):(m.passage?renderPassageBlockDark(m.passage):'')}
          ${m.sceneTag?renderPhotoBlock(m.sceneTag):''}
          ${m.audioScript?`<div style="margin-bottom:10px;display:flex;align-items:center;gap:8px;">${supportsSpeechSynthesis()?`<button class="btn btn-paper" onclick="playCurrentAudio()">🔊 播放語音</button><button class="speed-btn" onclick="cycleSpeechRate()" title="調整播放速度">${rate.toFixed(1)}x</button>`:`<div style="color:var(--paper);font-size:15px;font-weight:600;">${escapeHtml(m.audioScript)}</div>`}</div>`:''}
          ${renderQuestionOptions(m,m._selected!==undefined?m._selected:null, m._selected!==undefined, 'retestMistake', `'${m.id}',`)}
          ${m._selected!==undefined?`<div class="feedback ${m._selected===m.correctIndex?'correct':'wrong'}"><div class="feedback-title">${m._selected===m.correctIndex?'答對了':'答錯了'}</div><div>${escapeHtml(m.explanation||'')}</div></div>`:''}
          ${m._selected!==undefined&&m.grammarTip?`<div class="grammar-tip-callout" style="margin-top:12px;"><div class="grammar-tip-label">📘 文法小解說</div><div>${escapeHtml(m.grammarTip)}</div></div>`:''}
          ${m._selected!==undefined&&m.vocabWord?`<div class="vocab-callout" style="margin-top:12px;"><div><div class="word speak-word" data-word="${escapeHtml(m.vocabWord.word)}" onclick="speakText(this.dataset.word)" title="點擊聽發音">${escapeHtml(m.vocabWord.word)}</div><div class="def">${escapeHtml(m.vocabWord.definition)}</div></div></div>`:''}
        </div>`:''}
      </div>`;
    }).join('')}
    ${renderBottomNav('review')}
  `;
}

/* ========================= Render：單字本 ========================= */
function renderVocabBook(){
  const t=nowISO();
  let items=STATE.vocab;
  if(STATE.vocabFilter==='due') items=items.filter(v=>!v.mastered&&v.due<=t);
  else if(STATE.vocabFilter==='mastered') items=items.filter(v=>v.mastered);
  items=[...items].sort((a,b)=>a.due<b.due?-1:1);

  return `
    ${renderTopbar()}
    <h1 style="font-size:20px;">Vocabulary</h1>
    <p class="muted">答錯題目時系統會自動收錄該題的關鍵單字，之後的練習也會刻意帶到這些字加深印象。</p>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;">
      <div>
        <h2 style="margin-bottom:2px;">開始刷題</h2>
        <p class="muted" style="margin-bottom:0;">用選擇題形式連續複習你的單字卡，答對會拉長下次複習間隔</p>
      </div>
      <button class="btn btn-primary" style="flex:none;" onclick="startSession('wordCard')">開始複習</button>
    </div>
    <div class="filter-row">
      <button class="filter-chip ${STATE.vocabFilter==='due'?'active':''}" onclick="setVocabFilter('due')">待複習</button>
      <button class="filter-chip ${STATE.vocabFilter==='all'?'active':''}" onclick="setVocabFilter('all')">全部</button>
      <button class="filter-chip ${STATE.vocabFilter==='mastered'?'active':''}" onclick="setVocabFilter('mastered')">已精熟</button>
    </div>
    ${items.length===0?`<div class="empty">這個分類目前沒有單字，練習中答錯題目就會自動收錄囉。</div>`:
    `<div class="grid-2">${items.map(v=>{
      const flipped=STATE.flippedCard===v.id;
      const isPhrase=v.type==='phrase';
      return `<div class="flashcard" onclick="flipVocabCard('${v.id}')" style="min-height:140px;position:relative;">
        ${v.favorited?`<span style="position:absolute;top:10px;right:12px;color:var(--wrong);font-size:16px;">♥</span>`:''}
        <span class="badge ${isPhrase?'badge-scenario':'badge-vocab'}" style="margin-bottom:8px;">${isPhrase?'片語':'單字'}</span>
        <div class="fc-word speak-word" data-word="${escapeHtml(v.word)}" onclick="event.stopPropagation();speakText(this.dataset.word)" title="點擊聽發音" style="${isPhrase?'font-size:17px;line-height:1.4;':''}">${escapeHtml(v.word)}</div>
        ${flipped?`<div class="fc-def">${escapeHtml(v.definition)}</div>${v.example?`<div class="fc-ex">${escapeHtml(v.example)}</div>`:''}
          <div class="btn-row" onclick="event.stopPropagation()">
            <button class="btn btn-ghost" style="padding:7px 12px;font-size:12px;" onclick="gradeVocab('${v.id}',false)">還不熟</button>
            <button class="btn btn-primary" style="padding:7px 12px;font-size:12px;" onclick="gradeVocab('${v.id}',true)">記得了</button>
          </div>`:`<div class="fc-hint">點卡片查看定義・${v.mastered?'已精熟':formatDueRelative(v.due)}</div>`}
      </div>`;
    }).join('')}</div>`}
    ${renderBottomNav('review')}
  `;
}

/* ========================= 主渲染函式 ========================= */
function render(){
  closeWordLookup();
  const root=document.getElementById('root');
  if(STATE.loading){ root.innerHTML=renderTopbar()+renderLoading(); return; }
  switch(STATE.view){
    case 'welcome': root.innerHTML=renderWelcome(); break;
    case 'placement': root.innerHTML=renderPlacement(); break;
    case 'placementResult': root.innerHTML=renderPlacementResult(); break;
    case 'nameInput': root.innerHTML=renderNameInput(); break;
    case 'helloGreeting': root.innerHTML=renderHelloGreeting(); break;
    case 'onboardingTutorial': root.innerHTML=renderOnboardingTutorial(); break;
    case 'dashboard': root.innerHTML=renderDashboard(); break;
    case 'learn': root.innerHTML=renderLearn(); break;
    case 'review': root.innerHTML=renderReview(); break;
    case 'me': root.innerHTML=renderMe(); break;
    case 'session': root.innerHTML=renderSession(); break;
    case 'sessionResult': root.innerHTML=renderSessionResult(); break;
    case 'mistakeBook': root.innerHTML=renderMistakeBook(); break;
    case 'vocabBook': root.innerHTML=renderVocabBook(); break;
    default: root.innerHTML=renderLoading();
  }
}

init();
</script>
</body>
</html>
