<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello｜多益學習夥伴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Noto+Serif+TC:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#8B7FD1;
    --accent-dim:#6C5FB0;
    --accent-soft:#EDE9FB;
    --accent-soft-text:#6C5FB0;
    --ink:#332C4D;
    --ink-2:rgba(255,255,255,0.55);
    --ink-3:rgba(90,70,140,0.14);
    --accent-glow-1:rgba(139,127,209,0.38);
    --accent-glow-2:rgba(185,175,225,0.30);
    --accent-glow-3:rgba(122,108,196,0.26);
    --paper:#FFFFFF;
    --paper-2:#F4F0FC;
    --teal:#5FAE9E;
    --rust:#D9765F;
    --wrong:#E5484D;
    --wrong-dim:#B23A3D;
    --wrong-soft:#FBEAEA;
    --hamburger-color:#4E5366;
    --hamburger-glow:none;
    --ink-muted:#79708F;
    --paper-muted:#8B84A3;
    --radius:22px;
    --font-display:'Fraunces','Noto Serif TC',serif;
    --font-body:'Inter','Noto Sans TC',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --glass-blur:blur(20px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, var(--accent-glow-1), transparent 42%),
      radial-gradient(circle at 88% 20%, var(--accent-glow-2), transparent 42%),
      radial-gradient(circle at 25% 92%, var(--accent-glow-3), transparent 46%),
      linear-gradient(180deg,#F8F5FF 0%,#FBFAFF 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    line-height:1.5;
  }
  #root{max-width:880px;margin:0 auto;padding:20px 16px 90px;position:relative;}
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;height:62px;background:var(--ink-2);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-top:1px solid rgba(255,255,255,0.6);display:flex;z-index:45;box-shadow:0 -8px 30px rgba(120,100,180,0.10);}
  .bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--ink-muted);font-size:10.5px;font-weight:600;transition:color .15s ease;}
  .bottom-nav-item.active{color:var(--accent-dim);}
  #root.dissolving{animation:dissolveOut .28s ease-in forwards;}
  #root.materializing-root{animation:materializeIn .38s ease-out forwards;}
  @keyframes dissolveOut{
    0%{opacity:1;filter:blur(0) saturate(1);transform:scale(1);}
    100%{opacity:0;filter:blur(12px) saturate(1.3);transform:scale(1.04);}
  }
  @keyframes materializeIn{
    0%{opacity:0;filter:blur(10px) saturate(1.15);transform:scale(0.95);}
    55%{opacity:1;}
    100%{opacity:1;filter:blur(0) saturate(1);transform:scale(1);}
  }
  #root.dissolving::after{
    content:'';position:fixed;inset:-15%;pointer-events:none;z-index:60;
    background:
      radial-gradient(ellipse 16% 42% at 50% 44%, var(--accent-glow-1) 0%, var(--accent-glow-2) 38%, transparent 72%),
      radial-gradient(circle, var(--accent) 0.55px, transparent 1.1px);
    background-size: cover, 5px 5px;
    -webkit-mask-image:radial-gradient(ellipse 17% 44% at 50% 44%, black 0%, black 50%, transparent 78%);
    mask-image:radial-gradient(ellipse 17% 44% at 50% 44%, black 0%, black 50%, transparent 78%);
    animation:smokeOut .28s ease-out forwards;
  }
  #root.materializing-root::after{
    content:'';position:fixed;inset:-15%;pointer-events:none;z-index:60;
    background:
      radial-gradient(ellipse 16% 42% at 50% 44%, var(--accent-glow-1) 0%, var(--accent-glow-2) 38%, transparent 72%),
      radial-gradient(circle, var(--accent) 0.55px, transparent 1.1px);
    background-size: cover, 5px 5px;
    -webkit-mask-image:radial-gradient(ellipse 17% 44% at 50% 44%, black 0%, black 50%, transparent 78%);
    mask-image:radial-gradient(ellipse 17% 44% at 50% 44%, black 0%, black 50%, transparent 78%);
    animation:smokeIn .38s ease-in forwards;
  }
  @keyframes smokeOut{
    0%{opacity:0;transform:scale(0.85) translateY(0);}
    30%{opacity:0.75;}
    100%{opacity:0;transform:scale(1.4) translateY(-30px);}
  }
  @keyframes smokeIn{
    0%{opacity:0;transform:scale(1.35) translateY(20px);}
    45%{opacity:0.65;}
    100%{opacity:0;transform:scale(0.9) translateY(0);}
  }

  .topbar{display:flex;align-items:center;gap:12px;padding:8px 2px 26px;}
  .logo-mark{display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .15s ease;flex:none;width:42px;height:42px;}
  .logo-mark:hover{transform:scale(1.1);}
  .logo-spark-svg{filter:drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 12px var(--accent-soft));animation:sparklePulse 3s ease-in-out infinite;}
  @keyframes sparklePulse{0%,100%{opacity:0.88;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}
  .splash-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:
      radial-gradient(circle at 15% 8%, var(--accent-glow-1), transparent 42%),
      radial-gradient(circle at 88% 20%, var(--accent-glow-2), transparent 42%),
      radial-gradient(circle at 25% 92%, var(--accent-glow-3), transparent 46%),
      linear-gradient(180deg,#F8F5FF 0%,#FBFAFF 100%);
    transition:opacity .55s ease, filter .55s ease;
  }
  .splash-screen.fade-out{opacity:0;filter:blur(10px);pointer-events:none;}
  .splash-spark{filter:drop-shadow(0 0 10px var(--accent)) drop-shadow(0 0 20px var(--accent-soft));animation:sparklePulse 1.8s ease-in-out infinite;}
  .splash-title{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:24px;color:var(--ink);letter-spacing:0.08em;}
  .splash-sub{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);letter-spacing:0.1em;}
  .greeting{flex:1;min-width:0;}
  .greeting-hello{font-family:var(--font-display);font-style:italic;font-size:14px;color:var(--ink-muted);line-height:1.1;}
  .greeting-name{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hamburger-btn{width:42px;height:42px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .15s ease,opacity .15s ease;}
  .hamburger-btn:hover{transform:scale(1.1);opacity:0.72;}
  .hamburger-icon{width:16px;height:11px;position:relative;filter:var(--hamburger-glow,none);}
  .hamburger-icon span{position:absolute;left:0;right:0;height:1.6px;background:var(--hamburger-color,#4E5366);border-radius:2px;}
  .hamburger-icon span:nth-child(1){top:0;}
  .hamburger-icon span:nth-child(2){top:4.5px;}
  .hamburger-icon span:nth-child(3){top:9px;}

  .card{background:var(--ink-2);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,0.6);box-shadow:0 8px 30px rgba(120,100,180,0.10);border-radius:var(--radius);padding:24px;margin-bottom:16px;}
  .tier-card{cursor:pointer;transition:transform .15s ease,border-color .15s ease;}
  .tier-card:hover{transform:translateY(-2px);border-color:var(--accent-dim);}
  .tier-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .tier-time{font-family:var(--font-mono);font-size:12.5px;font-weight:700;color:var(--accent-dim);background:var(--accent-soft);padding:6px 13px;border-radius:99px;white-space:nowrap;flex:none;}
  .skip-link{font-size:13px;color:var(--ink-muted);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;}
  .skip-link:hover{color:var(--accent-dim);}
  .card-paper{background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:24px;box-shadow:0 8px 30px rgba(120,100,180,0.10);}

  h1{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.25;margin:0 0 10px;}
  h2{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0 0 12px;}
  p{margin:0 0 12px;color:inherit;}
  .muted{color:var(--ink-muted);font-size:13.5px;}
  .card-paper .muted{color:var(--paper-muted);}

  .btn{font-family:var(--font-body);font-weight:700;font-size:14.5px;padding:12px 22px;border-radius:14px;border:none;cursor:pointer;transition:transform .1s ease, filter .15s ease, opacity .15s ease;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--paper-2);color:var(--ink);border:1px solid var(--ink-3);}
  .btn-ghost:hover{border-color:var(--accent-dim);}
  .btn-paper{background:var(--ink);color:var(--paper);}
  .btn-paper:hover{filter:brightness(1.15);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .btn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;}
  .btn-grid .btn{width:100%;}
  .btn-grid>.btn:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:auto;min-width:50%;}
  @media(max-width:360px){ .btn-grid{grid-template-columns:1fr;} .btn-grid>.btn:last-child:nth-child(odd){width:100%;} }

  /* 首頁等級卡 */
  .hero-card{position:relative;background:var(--paper);color:var(--ink);border-radius:28px;padding:30px 28px;margin-bottom:18px;overflow:hidden;box-shadow:0 20px 60px rgba(120,100,180,0.16);}
  .hero-orb{position:absolute;width:230px;height:230px;border-radius:50%;top:-70px;right:-60px;background:radial-gradient(circle at 35% 35%, var(--accent-glow-1), var(--accent-glow-2) 55%, transparent 76%);filter:blur(4px);}
  .hero-content{position:relative;z-index:1;}
  .hero-eyebrow{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--paper-muted);font-weight:700;margin-bottom:6px;}
  .hero-level{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:27px;margin-bottom:4px;letter-spacing:0.1em;}
  .hero-score-row{display:flex;align-items:baseline;gap:8px;margin-top:16px;}
  .hero-score{font-family:var(--font-mono);font-weight:600;font-size:44px;color:var(--accent-dim);}
  .hero-score-label{font-size:11px;color:var(--paper-muted);letter-spacing:0.06em;text-transform:uppercase;}
  .hero-ai-msg{font-size:13px;color:var(--accent-dim);font-weight:600;margin-top:10px;}
  .focus-card{padding:20px 22px;}
  .recommended-card{background:var(--accent-soft);border-color:transparent;}
  .focus-card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .focus-card-label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-muted);font-weight:700;margin-bottom:4px;}
  .focus-card-title{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink);}
  .upcoming-row{display:flex;justify-content:space-between;align-items:center;padding:12px 6px;cursor:pointer;border-bottom:1px solid var(--ink-3);margin-bottom:6px;}
  .upcoming-link{font-size:12px;font-weight:700;color:var(--accent-dim);}
  .journey-steps{display:flex;align-items:center;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
  .journey-step{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--ink-2);color:var(--ink-muted);white-space:nowrap;}
  .journey-step.done{background:var(--accent-soft);color:var(--accent-dim);}
  .journey-step.current{background:var(--accent);color:#fff;}
  .journey-arrow{font-size:11px;color:var(--ink-3);}

  /* 新手導覽流程 */
  .onboard-screen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px 20px;animation:materialize .4s ease;}
  .onboard-screen h1{font-size:24px;margin-bottom:2px;}
  .onboard-input{width:100%;max-width:320px;padding:14px 16px;border-radius:14px;border:1px solid var(--ink-3);background:var(--paper-2);color:var(--ink);font-family:var(--font-body);font-size:16px;text-align:center;margin-top:18px;}
  .onboard-input:focus{outline:none;border-color:var(--accent-dim);}
  .hello-greeting-big{display:flex;flex-direction:column;align-items:center;}
  .greeting-hello-big{font-family:var(--font-display);font-style:italic;font-size:24px;color:var(--ink-muted);}
  .greeting-name-big{font-family:var(--font-display);font-weight:600;font-style:italic;font-size:44px;color:var(--ink);letter-spacing:0.04em;}
  .onboard-icon{font-size:46px;margin-bottom:6px;}
  .onboard-icon-svg{width:56px;height:56px;color:var(--accent-dim);display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
  .onboard-icon-svg svg{width:100%;height:100%;}
  .onboard-dots{display:flex;gap:6px;margin:20px 0 4px;}
  .onboard-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);transition:background .2s ease;}
  .onboard-dot.on{background:var(--accent);}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0;}
  .stat-box{background:var(--ink-2);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,0.6);border-radius:16px;padding:14px 16px;transition:transform .15s ease,border-color .15s ease;}
  .stat-box.clickable{cursor:pointer;}
  .stat-box.clickable:hover{transform:translateY(-2px);border-color:var(--accent-dim);}
  .stat-box .num{font-family:var(--font-mono);font-size:24px;font-weight:600;color:var(--accent-dim);}
  .stat-box .lbl{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}

  .progress-track{height:6px;background:var(--ink-3);border-radius:99px;overflow:hidden;margin:14px 0 4px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--wrong));border-radius:99px;transition:width .3s ease;}
  .progress-label{font-size:12px;color:var(--ink-muted);}

  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:0.03em;}
  .badge-vocab{background:rgba(95,174,158,0.16);color:#3F8677;}
  .badge-grammar{background:var(--accent-soft);color:var(--accent-soft-text);}
  .badge-review{background:var(--wrong-soft);color:var(--wrong-dim);}
  .badge-listening{background:rgba(121,112,143,0.14);color:#5C5476;}
  .badge-scenario{background:rgba(95,174,158,0.14);color:#3F8677;}
  .diff-dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px;}
  .diff-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);}
  .diff-dot.on{background:var(--accent);}

  .q-card{background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:26px;box-shadow:0 12px 40px rgba(120,100,180,0.14);}
  .q-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap;}
  .q-meta-right{display:flex;align-items:center;gap:8px;}
  .heart-btn{background:none;border:none;font-size:19px;line-height:1;color:var(--ink-muted);cursor:pointer;padding:2px;transition:transform .15s ease,color .15s ease;}
  .heart-btn:hover{transform:scale(1.15);}
  .heart-btn.active{color:var(--wrong);}
  .due-badge{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--accent-dim);background:var(--accent-soft);padding:5px 10px;border-radius:99px;white-space:nowrap;animation:materialize .3s ease;}
  .q-text{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.5;margin-bottom:18px;}
  .q-text-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px;}
  .q-text-row .q-text{margin-bottom:0;flex:1;}
  .icon-btn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid rgba(51,44,77,0.12);background:var(--paper-2);color:var(--ink);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:border-color .15s ease;}
  .speed-btn{font-family:var(--font-mono);font-size:12.5px;font-weight:700;color:var(--accent-dim);background:var(--accent-soft);border:none;padding:8px 13px;border-radius:99px;cursor:pointer;transition:transform .12s ease;}
  .speed-btn:hover{transform:scale(1.06);}
  .icon-btn:hover{border-color:var(--accent-dim);}
  .speak-word{cursor:pointer;border-bottom:1.5px dotted currentColor;}
  .speak-word:hover{opacity:0.75;}
  .opt-list{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:center;gap:12px;background:var(--paper-2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;cursor:pointer;font-size:14.5px;text-align:left;transition:all .12s ease;}
  .opt:hover{border-color:var(--accent-dim);}
  .opt-letter{width:26px;height:26px;flex:none;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--font-mono);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .opt-text-col{display:flex;flex-direction:column;gap:1px;}
  .opt-def{font-size:11.5px;color:var(--ink-muted);}
  .opt.correct{background:var(--accent-soft);border-color:var(--accent);}
  .opt.correct .opt-letter{background:var(--accent);}
  .opt.wrong{background:var(--wrong-soft);border-color:var(--wrong);}
  .opt.wrong .opt-letter{background:var(--wrong);}
  .opt.disabled{cursor:default;}
  .opt.disabled:not(.correct):not(.wrong):hover{border-color:transparent;}

  .feedback{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:14px;}
  .feedback.correct{background:var(--accent-soft);border:1px solid var(--accent);}
  .feedback.wrong{background:var(--wrong-soft);border:1px solid var(--wrong);}
  .feedback-title{font-weight:700;margin-bottom:4px;}
  .feedback.correct .feedback-title{color:var(--accent-dim);}
  .feedback.wrong .feedback-title{color:var(--wrong-dim);}

  @keyframes materialize{from{opacity:0;filter:blur(6px);transform:scale(0.96);}to{opacity:1;filter:blur(0);transform:scale(1);}}
  .feedback{animation:materialize .35s ease;}
  .opt.correct,.opt.wrong{animation:materialize .3s ease;}

  .grammar-tip-callout{margin-top:14px;background:var(--paper-2);border:1px dashed var(--ink-3);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--ink);}
  .grammar-tip-label{font-weight:700;font-size:12.5px;margin-bottom:4px;color:var(--accent-dim);}
  .vocab-callout{margin-top:14px;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .vocab-callout .word{font-family:var(--font-display);font-weight:700;font-size:15px;}
  .vocab-callout .def{font-size:12.5px;color:#C9C3DE;}

  .flashcard{background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:30px 24px;text-align:center;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 12px 40px rgba(120,100,180,0.14);}
  .flashcard .fc-word{font-family:var(--font-display);font-size:26px;font-weight:700;}
  .flashcard .fc-hint{font-size:12px;color:var(--paper-muted);}
  .flashcard .fc-def{font-size:15px;margin-top:6px;}
  .flashcard .fc-ex{font-size:13px;color:var(--paper-muted);font-style:italic;margin-top:6px;}

  .list-item{background:var(--ink-2);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;}
  .list-item:hover{border-color:var(--accent-dim);}
  .list-item-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .list-item-q{font-size:14px;font-weight:600;}
  .list-item-meta{font-size:11.5px;color:var(--ink-muted);margin-top:4px;}
  .expand{margin-top:12px;padding-top:12px;border-top:1px dashed var(--ink-3);}

  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .filter-chip{font-size:12.5px;padding:6px 12px;border-radius:99px;background:var(--ink-2);border:1px solid var(--ink-3);color:var(--ink-muted);cursor:pointer;}
  .filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:16px;}

  .checkin-grid{display:flex;gap:5px;margin-top:14px;flex-wrap:wrap;}
  .checkin-status{font-size:12.5px;font-weight:700;color:var(--ink-muted);padding:8px 14px;border-radius:99px;background:var(--paper-2);white-space:nowrap;}
  .checkin-status.done{color:var(--accent-dim);background:var(--accent-soft);}
  .checkin-day{width:20px;height:20px;border-radius:6px;background:var(--ink-3);transition:box-shadow .2s ease;}
  .checkin-day.on{background:var(--accent);box-shadow:0 0 6px var(--accent),0 0 14px var(--accent-soft);}

  .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink-3);border-top-color:var(--accent);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{font-family:var(--font-mono);font-size:13px;color:var(--ink-muted);letter-spacing:0.03em;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-muted);}
  .error-box{background:var(--wrong-soft);border:1px solid var(--wrong);border-radius:14px;padding:16px;color:var(--wrong-dim);font-size:14px;margin-bottom:16px;}

  textarea.speak-input{width:100%;border-radius:12px;border:1px solid var(--ink-3);background:var(--paper-2);color:var(--ink);padding:10px;font-family:var(--font-body);font-size:14px;resize:vertical;}

  footer.hint{text-align:center;margin-top:30px;font-size:11.5px;color:var(--ink-muted);}

  /* 懸浮展開卡片（今日練習／情境練習） */
  .collapsible-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .collapsible-head h2{margin-bottom:0;}
  .collapsible-head .chev{color:var(--ink-muted);font-size:14px;transition:transform .2s ease;}
  .collapsible-head.open .chev{transform:rotate(180deg);}
  .panel-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.28);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;animation:overlayFade .25s ease;}
  .panel-modal{background:rgba(255,255,255,0.62);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(255,255,255,0.8);border-radius:22px;box-shadow:0 30px 80px rgba(90,70,140,0.3);padding:26px;max-width:480px;width:100%;max-height:82vh;overflow-y:auto;animation:modalPopIn .42s cubic-bezier(.34,1.56,.64,1);color:var(--ink);}
  .panel-modal .muted{color:var(--paper-muted);}
  @keyframes modalPopIn{
    0%{opacity:0;transform:translateY(30px) scale(0.82);filter:blur(8px);}
    55%{opacity:1;transform:translateY(-6px) scale(1.03);filter:blur(0);}
    100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
  }
  @keyframes overlayFade{from{opacity:0;}to{opacity:1;}}

  /* 選單抽屜 */
  .menu-overlay{position:fixed;inset:0;background:rgba(50,40,80,0.22);backdrop-filter:blur(2px);z-index:40;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .menu-drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);background:rgba(255,255,255,0.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:-8px 0 40px rgba(90,70,140,0.2);z-index:41;padding:24px 20px 74px;overflow-y:auto;animation:slideIn .25s ease;}
  @keyframes slideIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  .menu-title{font-family:var(--font-display);font-weight:600;font-size:19.5px;letter-spacing:0.08em;}
  .menu-section{margin-bottom:26px;}
  .menu-section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-muted);font-weight:700;margin-bottom:12px;}
  .settings-sub-label{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:10px;}
  .menu-nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:4px;}
  .menu-nav-item svg{color:var(--accent-dim);flex:none;}
  .menu-nav-item:hover{background:var(--paper-2);}
  .menu-nav-item.active{background:var(--accent-soft);color:var(--accent-soft-text);}
  .menu-close{width:32px;height:32px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);opacity:0.85;transition:opacity .15s ease,transform .15s ease;filter:drop-shadow(0 0 3px var(--accent-glow-1)) drop-shadow(0 0 7px var(--accent-glow-1));}
  .menu-close:hover{opacity:1;transform:scale(1.1);}
  .name-input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--ink-3);background:var(--paper-2);color:var(--ink);font-family:var(--font-body);font-size:14px;margin-bottom:8px;}
  .color-swatch-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px;}
  .swatch-item{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .color-swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s ease,box-shadow .12s ease;}
  .color-swatch:hover{transform:scale(1.15);}
  .color-swatch.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper);}
  .swatch-hex{font-size:9px;font-family:var(--font-mono);color:var(--ink-muted);letter-spacing:0.02em;}
  .hex-input{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--ink-3);background:var(--paper-2);color:var(--ink);font-family:var(--font-mono);font-size:13.5px;letter-spacing:0.05em;text-transform:uppercase;}
  .settings-back{font-family:var(--font-display);font-style:italic;font-size:15px;color:var(--accent-dim);font-weight:600;cursor:pointer;margin-bottom:14px;display:inline-block;}
  .settings-back:hover{opacity:0.7;}
  .hex-row{display:flex;gap:8px;align-items:center;}
  .hex-row .hex-input{flex:1;}
  .eyedropper-btn{width:34px;height:34px;flex:none;border:none;background:transparent;color:var(--ink-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color .15s ease;}
  .eyedropper-btn:hover{color:var(--accent-dim);}
  .eyedropper-btn.active{color:var(--accent);}
  .color-picker{margin-top:14px;}
  .sv-square{position:relative;width:100%;height:130px;border-radius:12px;cursor:crosshair;background-image:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent);touch-action:none;}
  .sv-cursor{position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,0.35),0 1px 4px rgba(0,0,0,0.3);transform:translate(-50%,-50%);pointer-events:none;}
  .hue-slider{-webkit-appearance:none;appearance:none;width:100%;margin-top:12px;height:12px;border-radius:99px;background:linear-gradient(to right,red,#ff0,lime,cyan,blue,magenta,red);outline:none;cursor:pointer;}
  .hue-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,0.3);cursor:pointer;}
  .hue-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,0.3);cursor:pointer;}
  .icon-palette{transition:transform .25s ease;}
  .settings-sub-label:hover .icon-palette{transform:rotate(-14deg) scale(1.12);color:var(--accent-dim);}
  .menu-gear-btn{position:absolute;right:16px;bottom:14px;width:40px;height:40px;padding:0;border:none;background:transparent;color:var(--accent-dim);opacity:0.9;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s ease,opacity .2s ease,transform .15s ease;}
  .menu-gear-btn:hover{color:var(--accent-dim);opacity:1;transform:scale(1.08);}
  .menu-gear-btn:active{transform:scale(0.94);}
  .menu-gear-btn .icon-gear{display:block;transition:transform .1s linear;}
  .menu-gear-btn:hover .icon-gear{animation:gearSpin 1.4s linear infinite;}
  .settings-flyout{position:absolute;left:16px;right:16px;bottom:64px;background:rgba(255,255,255,0.96);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,0.85);border-radius:18px;box-shadow:0 20px 50px rgba(90,70,140,0.28);padding:18px;animation:popoverIn 180ms ease-out;z-index:5;}
  @keyframes popoverIn{
    0%{opacity:0;transform:translateY(-6px) scale(0.97);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }
  .popover-catcher{position:fixed;inset:0;z-index:55;background:transparent;}
  .glass-popover{position:absolute;z-index:56;background:rgba(255,255,255,0.72);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,0.85);border-radius:18px;box-shadow:0 20px 50px rgba(90,70,140,0.28);padding:18px;animation:popoverIn 180ms ease-out;}
  @keyframes gearSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  @media(max-width:520px){
    .menu-drawer{width:100vw;}
  }

  /* 個人設定清單（Preferences） */
  .pref-list{padding:4px 20px;}
  .pref-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 4px;cursor:pointer;border-bottom:1px solid var(--ink-3);transition:background .15s ease;}
  .pref-row:hover{background:var(--accent-soft);}
  .learn-mode-btn{transition:transform .1s ease, filter .15s ease, opacity .15s ease, background-color .15s ease, border-color .15s ease;}
  .learn-mode-btn.btn-ghost:hover{background:var(--accent-soft);border-color:var(--accent-dim);}
  .pref-row:last-child{border-bottom:none;}
  .pref-row.disabled{cursor:default;opacity:0.6;}
  .pref-row-label{font-size:14.5px;font-weight:600;color:var(--ink);}
  .pref-row-right{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-muted);}
  .pref-chevron{color:var(--ink-muted);font-size:14px;}
  .pref-soon-tag{font-size:10.5px;font-weight:700;color:var(--ink-muted);background:var(--paper-2);padding:3px 8px;border-radius:99px;}
  .theme-dot{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,0.06);}
  .pref-chevron{transition:transform 200ms ease-out;display:inline-block;}
  .pref-chevron.rotated{transform:rotate(90deg);}
  .pref-expand-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows 200ms ease-out;}
  .pref-expand-wrap.open{grid-template-rows:1fr;}
  .pref-expand-inner{overflow:hidden;}
  .pref-expand-content{background:var(--paper-2);border-radius:14px;padding:14px;margin:2px 0 10px;}

  /* ===== RWD ===== */
  @media(max-width:760px){
    #root{padding:18px 14px 74px;}
    .hero-card{padding:26px 22px;}
    .hero-orb{width:180px;height:180px;top:-50px;right:-50px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media(max-width:640px){
    h1{font-size:22px;}
    .hero-level{font-size:22px;}
    .hero-score{font-size:36px;}
    .q-card{padding:20px;}
    .q-text{font-size:17px;}
    .card{padding:18px;}
    .flashcard{padding:24px 18px;min-height:160px;}
    .flashcard .fc-word{font-size:22px;}
    .panel-modal{padding:20px;}
    .greeting-hello{font-size:12.5px;}
    .greeting-name{font-size:15.5px;}
  }
  @media(max-width:420px){
    #root{padding:14px 10px 70px;}
    .topbar{gap:8px;}
    .logo-mark{width:36px;height:36px;}
    .hamburger-btn{width:38px;height:38px;}
    .btn{padding:10px 16px;font-size:13.5px;}
    .hero-card{padding:20px 18px;}
    .hero-score{font-size:30px;}
    .hero-score-row{gap:6px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
    .stat-box{padding:12px 12px;}
    .stat-box .num{font-size:20px;}
    .checkin-day{width:16px;height:16px;}
    .opt{padding:10px 12px;font-size:13.5px;}
    .btn-row{gap:8px;}
  }
  @media(min-width:900px){
    #root{max-width:920px;}
  }
</style>
